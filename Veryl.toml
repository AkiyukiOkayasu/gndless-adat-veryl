[project]
name = "gndless_adat"
version = "0.3.0"
authors = ["Akiyuki Okayasu"]
description = "ADAT optical receive, transmit, and S/MUX2 cores for Veryl."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AkiyukiOkayasu/gndless-adat-veryl"

[build]
sources = ["src"]
target = { type = "directory", path = "target" }

[test]

[publish]
register = true
bump_commit = true
publish_commit = true

[dependencies]
# 未公開のローカル変更を利用するためpath指定。公開前にgithub依存へ戻す。
gndless_fixedpoint = { path = "../gndless-fixedpoint-veryl" }
